# Malaysia Open Data MCP Server - Docker Compose
# For self-hosting on VPS at mcp.techmavie.digital/datagovmy

services:
  mcp-datagovmy:
    build: .
    container_name: mcp-datagovmy
    restart: unless-stopped
    ports:
      - "8083:8080"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - NODE_ENV=production
      - ANALYTICS_DIR=/app/data
      # Optional: include a contact email in Nominatim requests for self-hosted deployments
      # - NOMINATIM_CONTACT_EMAIL=${NOMINATIM_CONTACT_EMAIL}
    env_file:
      - .env
    volumes:
      - analytics-data:/app/data
      - ./.credentials:/app/.credentials:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - mcp-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  mcp-network:
    driver: bridge

volumes:
  analytics-data:
    driver: local
